const DM=[{"id": "seiseki", "t": "成績算出の手順", "m": "# 成績(評価)算出スプレッドシートの使い方\n\n1. 「成績(評価)算出スプレッドシート」をコピー（「コメントをコピーする」に必ずチェック）\n2. 「基準一覧シート」で【観点比重】を入力\n3. 「【メモ】評価材料一覧シート」に「観点」と「課題名」を入力\n4. 「評価シート」に5桁番号・組・名前を入力\n5. 上部セルに「観点」を入力（右の「観点」をコピペ）\n6. 「課題名」を入力（例：1中間・1期末・2取組）\n7. 「MAX」に配点を入力するとABCの点数が自動表示（取組などはじめからABCのものはそのまま入力）\n8. 素点を入力。**欠席者は見込み点を算出**（《定期試験欠席者の評価方法》・◆見込点計算式）\n\n# 漢字小テスト\n\n- 平均点を算出して観点別評価シートの得点欄に入力→比重を調整してABC変換\n- 小テストを全て欠席した生徒は0点。公欠・出停・忌引は評価から除く\n- 欠席が非常に多い生徒は担当者で話し合って決定。留学生は空白（算出しない）\n\n# 提出物等\n\nA:5 B:3 C:1 D:0 で点数化→合計を算出→観点別評価シートに合計点とABC基準を入力"}, {"id": "kesseki", "t": "欠席・評価シート操作メモ", "m": "> 元資料で「いらなくなったデータ」とされていた部分です（国語科教科会 2023.7.4 ほか）。\n\n# 欠席の扱い\n\n- 後日試験（出停ではなく欠席）：**欠席は70%**（観点別ごと）。公欠・出停・忌引は100%\n- 定期試験欠席：公欠・出停・忌引→その試験をないものとして算出（分母から引く）／欠席→分母を減算せず0点\n- 単元テスト・小テスト欠席（後日試験なし）：未提出ならC判定\n- 例（2023年度2学期）：2学期から帰国した生徒が中間試験を公欠、後日受験も欠席、期末は受験 → 中間は期末の70%を見込み点として算出\n\n# 評価シート操作メモ（Ver5.0）\n\n- 観点別評価シートに「列」を追加・削除しない（5段階評価の関数に影響）\n- 該当箇所以外に「A」「B」「C」を入力しない（評価材料としてカウントされる）\n- 素点は学年全体のタブ（成績算出用の名簿と同じメンバー）を作ると貼り付けが1回で済む。留学生・退学者など未受験の生徒の得点欄は空欄（入れるとABC変換される）\n- 「❷素点素換」でABC変換の％を設定（基本はA=75%、C=34%）→「❸知識・技能」「❹思考・判断・表現」へ、主体的態度は「❺」へ貼り付け（学期ごとの欄に入力）\n- **「分母から減じる」**＝❸などのタブの「未評価資料数」に数値を入力すること（例：2学期に留学で試験の点がない→2）。帰国者は学期をまたいで積算（学年末は1学期からの積算値を入れる）\n- 転出・退学：「❻評定」の数値を消去し、一覧の人数も減らす\n- 評定平均がおかしい→入力タブのチェック入れ忘れを疑い、全タブのチェック欄を総点検"}, {"id": "ryugaku", "t": "留学中の成績", "m": "# 留学中生徒の成績算出方法\n\n- その学期にいない生徒の通知表は**とにかく空欄**。評定欄も空欄。評定平均の算出では留学中の生徒を除き、一覧の人数も減らす\n- **1年留学**：留学期間が長い方の学年を留学扱い。**注意➊** 1・3学期のみ（1学期間のみ）在籍していた生徒の成績は算出しない\n- **ターム留学**：留学期間以外の材料を積算して算出（例：2学期途中〜3学期の留学→1〜3学期の留学期間以外の材料を使い、分母から留学期間の材料を引く）。帰国直後の試験・課題などは差し引くなど配慮。学年末の成績は算出する。**注意➋** ターム留学中の学期は評定分布表から該当生徒を省く\n- **注意➌** 短期留学は、留学中の学期の通知表には何も入れない（空欄）。学年末の成績は算出する\n\n# 留学の型と学年成績（早見表PDFより）\n\n|長期A|8月出発・北米1年（8月中下旬〜6月下旬/7月上旬）|学年単位は包括認定／学年成績は2学期・3学期の積算|\n|長期B|1月出発・オセアニア1年（1月上中旬〜11月下旬/12月上旬）|学年成績は1学期・2学期・出発までの3学期の積算／学年単位は包括認定|\n|短期A|4月出発・オセアニア3か月（〜7月上中旬）|1学期の出発までと帰国後・2学期・3学期の積算|\n|短期B|8月出発・北米5か月（〜1月中下旬）|1学期・2学期出発まで・3学期帰国後の積算|\n|短期C-1|7月出発・2か月、1学期期末の未受験科目あり（7月上旬〜9月上旬）|1学期出発まで・2学期帰国後・3学期の積算。2学期中間は通常どおり成績に入れる|\n|短期C-2|7月出発・2か月、1学期期末は全科目受験（7月中下旬〜9月中下旬）|同上。2学期中間は成績に入れない|\n|短期D|1月出発・オセアニア3か月（1月上中旬〜4月上中旬）|1学期・2学期・3学期出発までの積算／1学期帰国後・2学期・3学期の積算（PDF記載の2パターン）|\n|短期E|上記以外|執行部・教務部・国際部で別途協議|\n\n> 留学中は出欠に「欠」を入力、短期は出発後・帰国前を「公欠」扱い。学期・試験ごとの入力表は原本PDF（リンク集「留学成績処理早見表」）で確認してください。"}, {"id": "kekka", "t": "欠課時数の確認", "m": "- 欠課時数超過が心配な生徒用に「欠課時数確認シート」と欠課時数早見表を使う（リンク集）\n- 欠課時数オーバーの科目は、全観点を「C」、評定を「1」としてZeusに入力。オーバーしていない科目は通常どおり評価（原級留置の条件と単位認定の条件は異なる）\n\n# 1. 科目全体（複数授業の合算）\n\n出欠管理→担当グループ／授業一覧から授業を選択→上部の「内訳」タブ→オレンジの「科目出欠合計」ボタン。遅刻・早退・遅早の3回で1欠席に換算されます。\n\n# 2. 成績抽出で出欠を取り出す\n\n成績管理→成績抽出→表示項目設定で授業情報の「授業出欠」を選択→出したいステータス（欠席・遅刻・早退など）にチェック。\n\n# 3. CSVで欠課時数を取り出す（Zeus取り込み用）\n\n担当グループ→科目→「内訳」タブ→日付範囲で学期を選択→CSVボタンでダウンロード→「欠席」セルを確認。出停・忌引は授業回数の分母から除外、**公欠は出席扱い**。\n\n# 4. 保護者の確認\n\n保護者ページ→出欠確認→「詳細」タブでHR・科目ごとの内訳が見られます（5月から翌日公開の設定）。"}];

async function pull(){if(!ready())return pubPull();const c=cfg();setSy('busy','同期中…');

const vLinks=()=>`<div style="display:flex;gap:8px;margin-bottom:6px"><input type="search" id="lq" placeholder="リンクを検索（例：採点、報告書）" value="${esc(LQ)}"><button data-a="ledit" class="${LE?'p':''}" style="white-space:nowrap">${LE?'編集を終える':'編集'}</button></div><div id="ll">${linksHtml()}</div>`+(LE?`<section class="sec"><h2>リンクを追加</h2><div class="pn"><div class="g2"><label>表示名<input type="text" id="nt"></label><label>URL<input type="text" id="nu" placeholder="https://..."></label></div><div class="g2"><label>グループ<select id="ng">${S.links.map(([n],i)=>`<option value="${i}">${esc(n)}</option>`).join('')}<option value="new">＋新しいグループ</option></select></label><label>新しいグループ名（上で「新しいグループ」を選んだとき）<input type="text" id="nn"></label></div><div><button class="p" data-a="ladd">追加する</button></div></div></section>`:'');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md2h(s){const L=s.split('\n');let o='',i=0;
 while(i<L.length){const l=L[i];
  if(/^#\s/.test(l)){o+='<h3>'+inl(l.slice(2))+'</h3>';i++}
  else if(/^-\s/.test(l)){o+='<ul>';while(i<L.length&&/^-\s/.test(L[i]))o+='<li>'+inl(L[i++].slice(2))+'</li>';o+='</ul>'}
  else if(/^\d+\.\s/.test(l)){o+='<ol>';while(i<L.length&&/^\d+\.\s/.test(L[i]))o+='<li>'+inl(L[i++].replace(/^\d+\.\s/,''))+'</li>';o+='</ol>'}
  else if(/^\|/.test(l)){o+='<table>';while(i<L.length&&/^\|/.test(L[i]))o+='<tr>'+L[i++].replace(/^\||\|$/g,'').split('|').map(c=>'<td>'+inl(c.trim())+'</td>').join('')+'</tr>';o+='</table>'}
  else if(/^>\s/.test(l)){o+='<p class="sub">'+inl(l.slice(2))+'</p>';i++}
  else if(l.trim()===''){i++}
  else{o+='<p>'+inl(l)+'</p>';i++}}
 return o||'<p class="sub">（本文がありません）</p>'}
function vMan(){const m=S.man.find(x=>x.id===OM)||S.man[0];if(m)OM=m.id;
 const seg=`<div class="seg">${S.man.map(x=>`<button class="${OM===x.id?'p':''}" data-mn="${x.id}">${esc(x.t)}</button>`).join('')}<button data-a="mnew">＋追加</button></div>`;
 if(!m)return seg+'<div class="empty">マニュアルがありません。「＋追加」で作れます。</div>';
 if(ME)return seg+`<div class="pn"><label>タイトル<input type="text" id="mt" value="${esc(m.t)}"></label><label>本文<textarea id="mb" rows="16">${esc(m.m)}</textarea></label><details><summary>書き方</summary><div class="sub">行頭に「# 」で見出し、「- 」で箇条書き、「1. 」で番号つきの手順、「> 」で注釈。「|項目|内容|」で表。<br>文中は **太字** と [表示名](https://...) のリンクが使えます。空行で段落が分かれます。</div></details><div><button class="p" data-a="msave">保存</button> <button data-a="mcancel">やめる</button> <button class="d" data-a="mdel">このマニュアルを削除</button></div></div>`;
 return seg+`<div class="mv">${md2h(m.m)}</div><div style="margin-top:10px"><button data-a="medit">このマニュアルを編集</button></div>`}
function vSet(){const c=Object.assign({},guess(),cfg());
 const tf=TF?(()=>{const e=TF==='edit',T=e?cur():{name:'',E:add(today,35),G:add(today,52),M:add(today,56),subs:['現代の国語','言語文化']};
  return`<div class="pn" style="margin-top:12px"><b>${e?'学期の日程を変更':'新しい学期を作る'}</b><label>学期名<input type="text" id="fn" value="${esc(T.name)}" placeholder="例：2027年度 1学期 中間"></label><div class="g2"><label>試験の初日<input type="date" id="fe" value="${T.E}"></label><label>成績の提出期限<input type="date" id="fg" value="${T.G}"></label></div><div class="g2"><label>成績会議の日<input type="date" id="fm" value="${T.M}"></label><label>科目（読点区切り）<input type="text" id="fs" value="${esc(T.subs.join('、'))}" ${e?'disabled':''}></label></div><div class="sub">${e?'未完了の作業の期限を、新しい日程に合わせて引き直します。':'日程から逆算して、試験準備〜成績会議の作業が自動で並びます。'}</div><div><button class="p" data-a="tok">${e?'日程を反映':'作成する'}</button> <button data-a="tcancel">やめる</button></div></div>`})():'';
 return`<section class="sec"><h2>学期</h2><div class="box">${S.terms.map(t=>`<div class="tr"><span><b>${esc(t.name)}</b>${t.id===S.cur?' <span class="sub">（表示中）</span>':''}<br><span class="sub">試験 ${md(t.E)}／成績提出 ${md(t.G)}／成績会議 ${md(t.M)}</span></span><span><button data-a="tsel" data-id="${t.id}">表示</button> <button data-a="tedit" data-id="${t.id}">日程変更</button> <button class="d" data-a="tdel" data-id="${t.id}">削除</button></span></div>`).join('')||'<div class="empty">学期がありません。</div>'}</div><div style="margin-top:10px"><button class="p" data-a="tnew">＋新しい学期</button></div>${tf}</section>
 <section class="sec"><h2>GitHubで同期（どのPCからでも同じデータを使う）</h2><div class="pn"><div class="g2"><label>ユーザー名<input type="text" id="go" value="${esc(c.owner||'')}"></label><label>リポジトリ名<input type="text" id="gr" value="${esc(c.repo||'')}"></label></div><label>アクセストークン<input type="password" id="gt" autocomplete="off" placeholder="${c.token?'保存済み（変更するときだけ入力）':'github_pat_...'}"></label><div class="g2"><label>データファイル名<input type="text" id="gp" value="${esc(c.path||'data.json')}"></label><label>ブランチ（空欄＝既定）<input type="text" id="gb" value="${esc(c.branch||'')}"></label></div><div><button class="p" data-a="ghsave">保存して同期</button> <button data-a="ghsync">今すぐ同期</button> <button data-a="ghoff">接続を解除</button></div>
 <details><summary>トークンの作り方</summary><ol class="sub"><li>GitHubで Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</li><li>Repository access は「Only select repositories」でこのリポジトリだけを選ぶ</li><li>Permissions の Contents を「Read and write」にする</li><li>表示されたトークンを上の欄に貼り、「保存して同期」</li></ol></details>
 <div class="sub">トークンはこの端末のブラウザにだけ保存され、ページには書き込まれません。新しいPCでは、このページを開いて一度だけ入力してください。公開リポジトリのため、data.json は誰でも読めます。生徒名などの個人情報は入力しないでください。</div></div></section>
 <section class="sec"><h2>バックアップ</h2><div class="pn"><textarea id="bk" rows="3" placeholder="データの全文を表示／貼り付けて復元"></textarea><div><button data-a="bshow">データを表示</button> <button data-a="brest">貼り付けた内容で復元</button></div></div></section>`}
// ===== 操作 =====
const $=id=>document.getElementById(id),V=id=>$(id).value;
function tab(k){TAB=k;LE=false;ME=false;try{history.replaceState(null,'','#'+k)}catch(e){}render();window.scrollTo(0,0)}
function act(a,el){
 if(a==='ledit'){LE=!LE;return render()}
 if(a==='ldel'){S.links[+el.dataset.g][1].splice(+el.dataset.i,1);save();return render()}
 if(a==='gdel'){if(!confirm('このグループとリンクをすべて削除します。よろしいですか？'))return;S.links.splice(+el.dataset.g,1);save();return render()}
 if(a==='ladd'){const n=V('nt').trim(),u=V('nu').trim();if(!n||!/^https?:/.test(u))return alert('表示名と、https:// で始まるURLを入力してください。');
  let g=V('ng');if(g==='new'){const gn=V('nn').trim();if(!gn)return alert('新しいグループ名を入力してください。');S.links.push([gn,[]]);g=S.links.length-1}
  S.links[+g][1].push([n,kind(u),u]);save();return render()}
 if(a==='mnew'){const id='m'+(uid++);S.man.push({id,t:'新しいマニュアル',m:''});OM=id;ME=true;save();return render()}
 if(a==='medit'){ME=true;return render()}if(a==='mcancel'){ME=false;return render()}
 if(a==='msave'){const m=S.man.find(x=>x.id===OM);m.t=V('mt').trim()||'無題';m.m=V('mb');ME=false;save();return render()}
 if(a==='mdel'){if(!confirm('このマニュアルを削除します。よろしいですか？'))return;S.man=S.man.filter(x=>x.id!==OM);OM='';ME=false;save();return render()}
 if(a==='badd'){const n=V('an').trim();if(!n||!V('ad'))return;S.tasks.push({id:'t'+(uid++),term:S.cur,ph:+V('ap'),title:n,sub:'',due:V('ad'),done:false,url:''});save();return render()}
 if(a==='tnew'){TF='new';return render()}if(a==='tcancel'){TF=null;return render()}
 if(a==='tsel'){S.cur=el.dataset.id;save();return render()}
 if(a==='tedit'){S.cur=el.dataset.id;TF='edit';return render()}
 if(a==='tdel'){if(!confirm('この学期と作業をすべて削除します。よろしいですか？'))return;const id=el.dataset.id;S.tasks=S.tasks.filter(t=>t.term!==id);S.terms=S.terms.filter(t=>t.id!==id);if(S.cur===id)S.cur=S.terms[0]?S.terms[0].id:null;save();return render()}
 if(a==='tok'){if(!V('fn').trim()||!V('fe')||!V('fg')||!V('fm'))return;const subs=V('fs').split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  if(TF==='edit'){const t=cur();Object.assign(t,{name:V('fn').trim(),E:V('fe'),G:V('fg'),M:V('fm')});const fr=gen(t,t.subs);
   S.tasks.filter(x=>x.term===t.id&&!x.done).forEach(x=>{const f=fr.find(y=>y.ph===x.ph&&y.title===x.title&&y.sub===x.sub);if(f)x.due=f.due})}
  else{const t={id:'T'+(uid++),name:V('fn').trim(),E:V('fe'),G:V('fg'),M:V('fm'),subs};S.terms.push(t);S.cur=t.id;S.tasks=S.tasks.concat(gen(t,subs))}
  TF=null;save();return render()}
 if(a==='ghsave'){const o=cfg();const c={owner:V('go').trim(),repo:V('gr').trim(),token:V('gt').trim()||o.token||'',path:V('gp').trim()||'data.json',branch:V('gb').trim()};
  try{localStorage.setItem(GK,JSON.stringify(c))}catch(e){}SHA=null;return pull()}
 if(a==='ghsync')return pull();
 if(a==='ghoff'){try{localStorage.removeItem(GK)}catch(e){}SHA=null;setSy('off');return render()}
 if(a==='bshow'){$('bk').value=JSON.stringify(S);$('bk').select()}
 if(a==='brest'){try{const s=JSON.parse(V('bk'));if(s&&s.tasks&&s.terms){S=ens(s);save();render()}}catch(e){$('bk').value='読み込めませんでした。バックアップの全文を貼り付けてください。'}}}
const app=$('app');
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t)return tab(t.dataset.tab);
 const m=e.target.closest('[data-mn]');if(m){OM=m.dataset.mn;ME=false;return render()}
 const a=e.target.closest('[data-a]');if(a)act(a.dataset.a,a)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='ts'){S.cur=t.value;save();return render()}
 if(d.gn!==undefined){S.links[+d.gn][0]=t.value;return save()}
 if(d.lt){const[g,i]=d.lt.split('.');S.links[+g][1][+i][0]=t.value;return save()}
 if(d.lu){const[g,i]=d.lu.split('.'),u=t.value.trim(),x=S.links[+g][1][+i];x[2]=u;x[1]=kind(u);return save()}
 if(d.tg){S.tasks.find(x=>x.id===d.tg).done=t.checked;save();render()}
 else if(d.dt&&t.value){S.tasks.find(x=>x.id===d.dt).due=t.value;save();render()}
 else if(d.ul){S.tasks.find(x=>x.id===d.ul).url=t.value.trim();save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='lq'){LQ=e.target.value;$('ll').innerHTML=linksHtml()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
S=load();const h0=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h0))TAB=h0;
render();pull();
</script>
